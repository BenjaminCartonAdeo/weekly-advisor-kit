[project]
name = "weekly-advisor"
version = "0.4.1"
description = "OpenCode weekly advisor pipeline: telemetry aggregation, ecosystem watch, harness lint, insights, deterministic report + CLI — spec opencode-weekly-advisor v6.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.26", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.1.0"]

[project.scripts]
weekly-telemetry-aggregator = "weekly_telemetry_aggregator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["weekly_telemetry_aggregator"]

[tool.setuptools.package-data]
weekly_telemetry_aggregator = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests against a live local OpenCode instance (skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]
