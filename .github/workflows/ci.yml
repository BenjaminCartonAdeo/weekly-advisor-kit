name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .opencode/plugins/weekly-advisor-engine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install (lockfile reproductible + extras dev)
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (237, aucun réseau)
        run: uv run pytest -q
      - name: Packaging
        run: uv build
      - name: Wheel content (template inclus)
        run: uv run python -c "import zipfile,glob,sys; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'templates/report_template.md.j2' in names else 1)"

      - name: Plugin TS (syntaxe)
        run: node --check .opencode/plugins/weekly-advisor.ts
        working-directory: .

      - name: Node 24 (type stripping TS natif)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Plugin smoke test (exécution)
        # Régression layout v6.0 : les tools plantaient au 1er appel
        # (ReferenceError: worktree is not defined) — node --check ne le voit pas.
        # Faux moteur + python factice : closure, lookback_days, ancre fraîche/périmée.
        run: node scripts/plugin-smoke.mjs
        working-directory: .

      - name: Contrat de flux docs ↔ code (G1, 5 surfaces)
        # Mediation TS→CLI, handlers, artefacts par étape, chaînage d'ordre,
        # comptes de tests README/INSTALL/ci == collect réel.
        run: node scripts/check-flow-docs.mjs
        working-directory: .
