name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .opencode/plugins/weekly-advisor-engine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install (lockfile reproductible + extras dev)
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (aucun réseau)
        # Keep test and check-flow-docs collection in the same uv/Python environment.
        run: uv run python -m pytest -q
        if: runner.os == 'Windows'
      - name: Tests + coverage (lcov)
        # Single pytest pass per runner; the Linux run also emits the lcov report
        # consumed by the repowise job.
        run: uv run python -m pytest -q --cov=weekly_telemetry_aggregator --cov-report=lcov:coverage/lcov.info
        if: runner.os == 'Linux'
      - name: Upload lcov (repowise gate)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: .opencode/plugins/weekly-advisor-engine/coverage/lcov.info
          if-no-files-found: error
      - name: Packaging
        run: uv build
      - name: Wheel content (template inclus)
        run: uv run python -c "import zipfile,glob,sys; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if any('templates/report_template.md.j2' in n for n in names) else 1)"

      - name: Node 24 (type stripping TS natif)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Plugin TS (dual-entrypoint validation)
        run: |
          node --experimental-strip-types -e "import('./.opencode/plugins/weekly-advisor.ts').then(m => { const p = m.default; if (!p || p.id !== 'weekly-advisor' || typeof p.server !== 'function' || typeof p.setup !== 'function') { console.error('bad dual entrypoint', Object.keys(p ?? {})); process.exit(1) } }).catch(e => { console.error('Error:', e.message); process.exit(1) })"
        working-directory: .

      - name: Tests de contrat node (POSIX)
        # scripts/tests/*.test.mjs : contrats docs ↔ code (runner worker, exit,
        # F6, preflight). POSIX-only (sh, /tmp) → Ubuntu uniquement.
        if: runner.os == 'Linux'
        run: node --test scripts/tests/*.test.mjs
        working-directory: .

      - name: Contrat de flux docs ↔ code (G1, 7 surfaces)
        # Mediation TS→CLI, handlers, artefacts par étape, chaînage d'ordre,
        # collecte pytest exécutable (documentation counts are advisory).
        run: node scripts/check-flow-docs.mjs
        working-directory: .

      - name: Smoke test — self-test (harness syntax + plugin structure)
        # Validates harness loads correctly, plugin entry point exists,
        # package constraint is declared. Runs in non-strict mode (skips missing binaries).
        # This is the baseline self-test, always runs, cannot fail.
        run: |
          node scripts/smoke-dual-runtime.mjs --non-strict --quiet
        working-directory: .

      - name: Smoke test — V1/V2 compatibility (strict, if binaries provided)
        # Optional: when V1 and V2 binaries are explicitly provisioned via env vars,
        # run in strict mode to validate actual V1/V2 compatibility with the plugin.
        # This requires OPENCODE_V1_BIN, OPENCODE_V2_BIN, and optionally expected versions.
        # Skipped silently if binaries are not available.
        # NOTE: if: gates are evaluated before step-level env:, so we gate in shell instead.
        env:
          # Map secrets/vars to env for shell access (no direct secret references in shell)
          OPENCODE_V1_BIN: ${{ secrets.OPENCODE_V1_BIN || env.OPENCODE_V1_BIN || '' }}
          OPENCODE_V2_BIN: ${{ secrets.OPENCODE_V2_BIN || env.OPENCODE_V2_BIN || '' }}
          V1_EXPECTED_VERSION: ${{ vars.V1_EXPECTED_VERSION || '' }}
          V2_EXPECTED_VERSION: ${{ vars.V2_EXPECTED_VERSION || '' }}
        run: |
          # Strict test — provision binaries and run compatibility validation
          # This is an opt-in compatibility gate for dual-runtime validation
          if [ -n "${OPENCODE_V1_BIN}" ] && [ -n "${OPENCODE_V2_BIN}" ]; then
            node scripts/smoke-dual-runtime.mjs --strict --quiet
          else
            echo "V1/V2 binaries not provisioned; skipping strict compatibility check"
          fi
        shell: bash
        working-directory: .

      - name: Garde anti-drift kit → cible (non bloquante si cible absente)
        # Le kit est la source de vérité ; la cible du cron (ex. ../Adeo) doit le
        # refléter. Sur un runner GitHub la cible n'existe pas → SKIP propre, exit 0.
        # Pour un contrôle réel : WEEKLY_SYNC_TARGET=<racine cible> scripts/check-drift.sh
        run: |
          bash scripts/check-drift.sh
        working-directory: .

  repowise:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # REQUIRED: the risk gate ranks the change against the repository's own
          # recent commits (at least 8) and needs a merge-base with the target
          # branch; a shallow clone makes it exit 2 instead of guessing.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts
      - name: Gates repowise (non bloquantes au démarrage)
        # Repowise resolves every path from the repository root, NOT from the
        # package dir the test job defaults to, so this step runs from `.`
        # explicitly rather than inheriting the job default.
        uses: repowise-dev/repowise@v0.55.0
        # Deliberate for the first runs: the gates are untested against this
        # repository, and a first red gate must not block every pull request.
        # Remove this once the gates have been green long enough to trust them.
        continue-on-error: true
        with:
          # doc-drift is deliberately excluded: its `--check` validates the whole
          # tree and this repository's documentation has already drifted, so it
          # would fail from the first run. It needs a committed baseline
          # (`repowise doc-drift --check --write-baseline`) that cannot be
          # generated from here. Add it back once the baseline exists.
          checks: coverage,security,risk
          coverage-report: artifacts/lcov.info=.opencode/plugins/weekly-advisor-engine
          # PATCH coverage on changed lines, not the project's 88.47%: a
          # different number. Start at 0 so the gate reports without blocking;
          # put a real threshold here once real values have been observed.
          coverage-fail-under: 0
          coverage-min-coverable-lines: 5 # small-change tolerance
          risk-fail-above-percentile: 95
          # Same release as the `uses:` ref, so the action installs exactly that.
          version: v0.55.0
        working-directory: .
