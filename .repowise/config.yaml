# Repowise config for weekly-advisor-kit.
#
# Scope: what the index is allowed to treat as source, and how to line the CI
# coverage report up with the repo-root file tree.

# --- Index scope -----------------------------------------------------------
# Generated render output, not source. One generator run emits the .png, the
# .svg and the .html of the same diagram, so all three families are excluded
# together. Without this they are scored as source and drag down the governance
# / ownership metrics.
exclude_patterns:
  - "doc/diagrams/*.png"
  - "doc/diagrams/*.svg"
  - "doc/diagrams/*.html"
  # `.opencode/package-lock.json` is a lockfile, which repowise already excludes
  # as a built-in; listed explicitly so the intent survives if that default moves.

# NOT excluded on purpose: doc/architecture/schemas/*.json. Those are not
# generated — their README calls them "documentaires" and they are hand-written
# contracts that scripts/check-flow-docs.mjs validates against, so dropping them
# would hide real source from the graph.

# Coverage is deliberately NOT configured here.
# The only lcov report is produced by CI (see .github/workflows/ci.yml, job `repowise`)
# and is a gitignored build artifact, so the hosted indexer — which reads the git
# repository — can never resolve a path to it. Keeping a `coverage.paths` entry here
# only made the index advertise a source it cannot read (`file_count_with_coverage: 0`,
# every `line_coverage_pct: null`). The CI gate stays the single coverage authority;
# it reads the report through the action input `coverage-report`, not through this file.